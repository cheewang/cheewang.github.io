baseURL = "https://qifan.wang/"
languageCode = "zh-cn"
title = "琦凡的博客"
theme = "hugo-theme-stack/v5"
pygmentsUseClasses = true

[params]
  mainSections = ["post"]
  description = "个人知识沉淀"
  enableEmoji = true
  summaryLength = 100

  [params.sidebar]
    emoji = "📚"
    subtitle = "记录与沉淀"
    description = "技术笔记、工作复盘、生活随记"

  [params.article]
    readingTime = true
    license = ""

  [params.footer]
    since = 2026

  appearance = "auto"

[markup]
  [markup.goldmark]
    renderer = { unsafe = true }

[frontmatter]
  date = ["date", ":default"]
  lastmod = [":fileModTime", ":default"]

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  taxonomies = ["HTML", "RSS"]

[taxonomies]
  category = "categories"
  tag = "tags"