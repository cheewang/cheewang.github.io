baseURL = "https://qifan.wang/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "琦凡的博客"
theme = "hugo-theme-stack"
hasCJKLanguage = true

[params]
    mainSections = ["post"]
    description = "个人知识沉淀"
    summaryLength = 100

    [params.sidebar]
        emoji = "📚"
        subtitle = "记录与沉淀"
        description = "技术笔记、工作复盘、生活随记"

    [params.article]
        readingTime = true

    [params.footer]
        since = 2026

[markup]
  [markup.goldmark]
    renderer = { unsafe = true }

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[taxonomies]
  category = "categories"
  tag = "tags"

[frontmatter]
  date = ["date", ":default"]
  lastmod = [":fileModTime", ":default"]